name: Bug report
description: Report a reproducible problem without exposing sensitive data
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, account content, personal memory, private logs, or exploitable security details. Report vulnerabilities privately as described in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: JARVIS version or commit
      description: Provide the release, tag, or commit hash where the problem occurs.
      placeholder: v2.0.0 or commit abc1234
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include Windows version, 64-bit Python version, and relevant hardware.
      placeholder: Windows 11, Python 3.12.x, microphone model if relevant
    validations:
      required: true
  - type: dropdown
    id: startup_mode
    attributes:
      label: Startup mode
      options:
        - Direct
        - Wake word
        - Wake word with console
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest repeatable sequence, using fictitious or sanitized data.
      placeholder: |
        1. Start JARVIS with...
        2. Open...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: Describe the behavior you expected.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Describe what happened instead, including frequency.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or evidence
      description: Remove keys, tokens, account data, personal paths, memory, and private content. State "None" if unavailable.
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: sensitive_data
    attributes:
      label: Sensitive-data confirmation
      options:
        - label: I checked this report and its attachments for secrets, personal data, account content, memory, and private logs.
          required: true
        - label: This report does not disclose an exploitable vulnerability that should be reported privately.
          required: true
